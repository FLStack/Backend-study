spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # HikariCP 커넥션 풀 설정 추가
    hikari:
      maximum-pool-size: 5       # 풀 최대 개수를 5개로 제한 (EMAXCONNSESSION 에러 방지)
      minimum-idle: 2            # 최소 유휴 커넥션 수
      idle-timeout: 300000       # 유휴 커넥션 유지 시간 (5분)
      max-lifetime: 600000       # 커넥션 최대 생명주기 (10분)
      connection-timeout: 30000  # 커넥션 획득 대기 시간 (30초)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  test:
    database:
      replace: none
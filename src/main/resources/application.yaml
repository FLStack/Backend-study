spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.bgincodjshyqtvecamzz.supabase.co:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD} # 기본값 없이 환경변수 참조
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect